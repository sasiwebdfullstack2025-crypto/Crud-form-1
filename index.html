<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Login CRUD</title>
    <link rel="stylesheet" href="./crud.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">SASI EmployeePortal</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Employees</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Records</a>
        </li>
      </ul>

      <a href="#" class="btn btn-primary ms-lg-3">Login</a>
    </div>
  </div>
</nav>

<section class="bg-primary text-white py-5">
  <div class="container">
    <div class="row align-items-center">
      
      <!-- Left Content -->
      <div class="col-lg-6 text-center text-lg-start">
        <h1 class="display-5 fw-bold mb-3">
          Manage Employee Records Easily
        </h1>
        <p class="lead mb-4">
          Add, edit, and track employee details securely in one place.
        </p>
        <a href="#employeeForm" class="btn btn-light btn-lg">
          Get Started
        </a>
      </div>

      <!-- Right Image -->
      <div class="col-lg-6 text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/2922/2922510.png"
             class="img-fluid"
             style="max-height:300px;"
             alt="Employee Management">
      </div>

    </div>
  </div>
</section>

    <h2>Employee Login Form</h2>

    <form id="employeeForm">
        <input type="hidden" id="editIndex">

        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Password:</label>
        <input type="password" id="password" required>

        <button type="submit">Save</button>
    </form>

    <h3>Employee Records</h3>
    <table id="employeeTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Password</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="./crud.js"></script>
</body>
</html>
